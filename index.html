<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const RECORD = new URLSearchParams(location.search).has('record');
if (RECORD) document.body.classList.add('record');

/* ================= الأبعاد الأساسية (بالمتر) =================
   المبنى 14 × 16 م. المحور x من اليسار لليمين، والمحور z من الواجهة (أعلى المخطط) إلى الخلف. */
const G0 = 0.9;          // منسوب أرضية الطابق الأرضي فوق الشارع
const FH = 3.2;          // من أرضية إلى أرضية (سقف 3 م + بلاطة 0.2)
const CEIL = 3.0;
const LV = [G0, G0 + FH];
const ROOF = G0 + 2 * FH;
const EYE = 1.6;
const YARD = { x1: -1, x2: 15, z1: -2, z2: 17 }; // الفناء/البرندا حول البيت

/* ================= أدوات ================= */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function canvasTex(size, draw, meters, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (meters) t.repeat.set(1 / meters, 1 / meters);
  return t;
}
function tileTex(base, grout, n, seed, vary = 10, speck = 0.05) {
  const r = rng(seed);
  return (g, s) => {
    const step = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const c = new THREE.Color(base); const d = (r() - 0.5) * vary / 255;
      c.r += d; c.g += d; c.b += d;
      g.fillStyle = '#' + c.getHexString(); g.fillRect(i * step, j * step, step, step);
    }
    for (let k = 0; k < s * s * speck / 40; k++) { g.fillStyle = `rgba(0,0,0,${r() * 0.06})`; g.fillRect(r() * s, r() * s, 2, 2); }
    g.strokeStyle = grout; g.lineWidth = Math.max(2, s / 256);
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * step, 0); g.lineTo(i * step, s); g.stroke(); g.beginPath(); g.moveTo(0, i * step); g.lineTo(s, i * step); g.stroke(); }
  };
}
function marbleTex(base, vein, seed) {
  const r = rng(seed);
  return (g, s) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (let v = 0; v < 14; v++) {
      let x = r() * s, y = r() * s, a = r() * Math.PI * 2;
      g.strokeStyle = vein; g.globalAlpha = 0.15 + r() * 0.35; g.lineWidth = 0.5 + r() * 2.2;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 60; k++) { a += (r() - 0.5) * 0.7; x += Math.cos(a) * 9; y += Math.sin(a) * 9; g.lineTo(x, y); }
      g.stroke();
    }
    g.globalAlpha = 1;
  };
}
function woodTex(base, dark, seed, planks = 0) {
  const r = rng(seed);
  return (g, s) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (let k = 0; k < 140; k++) {
      g.strokeStyle = dark; g.globalAlpha = 0.04 + r() * 0.1; g.lineWidth = 1 + r() * 3;
      const y = r() * s; g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= s; x += 32) g.lineTo(x, y + Math.sin(x / 70 + k) * 3);
      g.stroke();
    }
    g.globalAlpha = 1;
    if (planks) { g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 2; for (let i = 0; i <= planks; i++) { const y = i * s / planks; g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); } }
  };
}
function rugTex(c1, c2, c3, seed, style = 0) {
  const r = rng(seed);
  return (g, s) => {
    g.fillStyle = c1; g.fillRect(0, 0, s, s);
    g.strokeStyle = c2; g.lineWidth = s * 0.035; g.strokeRect(s * 0.06, s * 0.06, s * 0.88, s * 0.88);
    g.strokeStyle = c3; g.lineWidth = s * 0.012; g.strokeRect(s * 0.12, s * 0.12, s * 0.76, s * 0.76);
    if (style === 0) {
      g.fillStyle = c2; g.save(); g.translate(s / 2, s / 2); g.rotate(Math.PI / 4); g.fillRect(-s * 0.16, -s * 0.16, s * 0.32, s * 0.32); g.restore();
      g.fillStyle = c3; g.save(); g.translate(s / 2, s / 2); g.rotate(Math.PI / 4); g.fillRect(-s * 0.08, -s * 0.08, s * 0.16, s * 0.16); g.restore();
      for (let i = 0; i < 4; i++) { g.fillStyle = c3; g.beginPath(); g.arc(s * (i % 2 ? 0.8 : 0.2), s * (i < 2 ? 0.2 : 0.8), s * 0.04, 0, 7); g.fill(); }
    } else {
      for (let i = 0; i < 9; i++) { g.strokeStyle = i % 2 ? c2 : c3; g.globalAlpha = 0.5; g.lineWidth = s * 0.01; g.beginPath(); g.moveTo(s * 0.15, s * (0.2 + i * 0.075)); g.lineTo(s * 0.85, s * (0.2 + i * 0.075)); g.stroke(); }
      g.globalAlpha = 1;
    }
    for (let k = 0; k < 4000; k++) { g.fillStyle = `rgba(0,0,0,${r() * 0.05})`; g.fillRect(r() * s, r() * s, 2, 2); }
  };
}
function noiseTex(base, amt, seed) {
  const r = rng(seed);
  return (g, s) => { g.fillStyle = base; g.fillRect(0, 0, s, s); for (let k = 0; k < s * s / 6; k++) { g.fillStyle = r() > 0.5 ? `rgba(255,255,255,${r() * amt})` : `rgba(0,0,0,${r() * amt})`; g.fillRect(r() * s, r() * s, 1.5, 1.5); } };
}
function artTex(seed, palette) {
  const r = rng(seed);
  return (g, s) => {
    g.fillStyle = palette[0]; g.fillRect(0, 0, s, s);
    for (let k = 0; k < 7; k++) { g.fillStyle = palette[1 + (k % (palette.length - 1))]; g.globalAlpha = 0.75; g.beginPath(); g.arc(r() * s, r() * s, s * (0.1 + r() * 0.3), 0, 7); g.fill(); }
    g.globalAlpha = 1;
  };
}

// خريطة نتوء (normal map) من خريطة ارتفاع مرسومة: تعطي الجص والفواصل والقماش ملمساً حقيقياً
function normalTex(size, drawHeight, meters, strength = 2) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  drawHeight(g, size);
  const h = g.getImageData(0, 0, size, size).data, out = g.createImageData(size, size), o = out.data;
  const H = (x, y) => h[(((y + size) % size) * size + ((x + size) % size)) * 4] / 255;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y + 1) - H(x, y - 1)) * strength;
    const l = Math.hypot(dx, dy, 1), i = (y * size + x) * 4;
    o[i] = (-dx / l * 0.5 + 0.5) * 255; o[i + 1] = (dy / l * 0.5 + 0.5) * 255; o[i + 2] = (1 / l * 0.5 + 0.5) * 255; o[i + 3] = 255;
  }
  g.putImageData(out, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (meters) t.repeat.set(1 / meters, 1 / meters);
  return t;
}
const groutH = (n) => (g, s) => { g.fillStyle = '#fff'; g.fillRect(0, 0, s, s); g.strokeStyle = '#000'; g.lineWidth = Math.max(3, s / 160); const st = s / n; for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * st, 0); g.lineTo(i * st, s); g.stroke(); g.beginPath(); g.moveTo(0, i * st); g.lineTo(s, i * st); g.stroke(); } };
const noiseH = (seed, amt = 1, blur = 2) => (g, s) => { const r = rng(seed); g.fillStyle = '#808080'; g.fillRect(0, 0, s, s); for (let k = 0; k < s * s / 3; k++) { const v = 128 + (r() - 0.5) * 255 * amt; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(r() * s, r() * s, blur, blur); } };
const weaveH = (n) => (g, s) => { const st = s / n; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const v = (x + y) % 2 ? 200 : 70; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x * st, y * st, st, st); } };

// صور حقيقية: خشب، عشب، وإضاءة بيئية HDRI
const IMG = {};
// الملفات الثنائية (نماذج GLB وإضاءة EXR) محفوظة نصاً بترميز base64
async function loadBin(path) {
  const r = await fetch(path + '.txt'); if (!r.ok) throw new Error('تعذّر تحميل ' + path);
  const bin = atob((await r.text()).trim()), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
async function loadImages() {
  const L = new THREE.TextureLoader();
  const get = async (k, f, srgb) => { const t = await L.loadAsync('assets/textures/' + f); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; IMG[k] = t; };
  await Promise.all([get('wood', 'hardwood2_diffuse.jpg', true), get('woodBump', 'hardwood2_bump.jpg'), get('woodRough', 'hardwood2_roughness.jpg'), get('grass', 'grasslight-big.jpg', true), get('grassN', 'grasslight-big-nm.jpg')]);
}
function woodMat(tint, meters = 1.2, rough = 1) {
  const rep = (t) => { const c = t.clone(); c.repeat.set(1 / meters, 1 / meters); c.needsUpdate = true; return c; };
  const m = new THREE.MeshStandardMaterial({ color: tint, map: rep(IMG.wood), bumpMap: rep(IMG.woodBump), bumpScale: 1.2, roughnessMap: rep(IMG.woodRough), roughness: rough });
  m.userData.worldUV = true; return m;
}

/* ================= المواد ================= */
const M = {};
function std(color, rough = 0.85, metal = 0, extra = {}) { return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra }); }
function texMat(tex, rough = 0.8, extra = {}) { const m = new THREE.MeshStandardMaterial({ map: tex, roughness: rough, ...extra }); m.userData.worldUV = true; return m; }
function buildMaterials() {
  M.wall = new THREE.MeshStandardMaterial({ color: '#f1ede6', roughness: 0.92, normalMap: normalTex(256, noiseH(5, 0.5, 3), 0.8, 1.2), normalScale: new THREE.Vector2(0.35, 0.35) }); M.wall.userData.worldUV = true;
  M.ceil = std('#fbfaf7', 0.95);
  M.facade = texMat(canvasTex(512, noiseTex('#e7d8bf', 0.06, 3), 1.0), 0.95); M.facade.normalMap = normalTex(512, noiseH(6, 0.9, 2), 1.0, 2.5); M.facade.normalScale.set(0.6, 0.6);
  M.trim = std('#f7f4ee', 0.8);
  M.plinth = texMat(canvasTex(256, tileTex('#b8a68a', '#9e8d73', 2, 4, 14, 0.2), 1.2), 0.95);
  M.floor = texMat(canvasTex(512, tileTex('#e6e0d6', '#cbc3b5', 2, 11, 9), 1.2), 0.22); M.floor.normalMap = normalTex(512, groutH(2), 1.2, 3); M.floor.normalScale.set(0.5, 0.5);
  M.floorUp = texMat(canvasTex(512, tileTex('#e3ddd2', '#c8c0b2', 2, 12, 9), 1.2), 0.22); M.floorUp.normalMap = normalTex(512, groutH(2), 1.2, 3); M.floorUp.normalScale.set(0.5, 0.5);
  M.wet = texMat(canvasTex(512, tileTex('#c3c8cb', '#a4aaae', 4, 13, 8), 1.2), 0.3); M.wet.normalMap = normalTex(512, groutH(4), 1.2, 3); M.wet.normalScale.set(0.5, 0.5);
  M.bathWall = texMat(canvasTex(512, tileTex('#eef1f1', '#cfd6d8', 4, 14, 5, 0.01), 1.2), 0.15); M.bathWall.normalMap = normalTex(512, groutH(4), 1.2, 3); M.bathWall.normalScale.set(0.5, 0.5);
  M.paving = texMat(canvasTex(512, tileTex('#cdbfa5', '#ad9f86', 3, 15, 18, 0.15), 1.2), 0.9); M.paving.normalMap = normalTex(512, groutH(3), 1.2, 3);
  M.marble = texMat(canvasTex(512, marbleTex('#f4f3f0', '#8e8a85', 21), 1.6), 0.18);
  M.stair = texMat(canvasTex(512, marbleTex('#ece7df', '#a9a197', 22), 1.4), 0.25);
  M.walnut = woodMat('#8b6247', 0.55);
  M.oak = woodMat('#ffffff', 0.6);
  M.slats = woodMat('#c9a27e', 0.6);
  M.grass = new THREE.MeshStandardMaterial({ map: IMG.grass.clone(), normalMap: IMG.grassN.clone(), roughness: 1, color: '#c8d8b0' });
  M.grass.map.repeat.set(1 / 6, 1 / 6); M.grass.normalMap.repeat.set(1 / 6, 1 / 6); M.grass.userData.worldUV = true;
  M.asphalt = texMat(canvasTex(256, noiseTex('#5a5d60', 0.12, 42), 2.0), 0.95);
  M.sidewalk = texMat(canvasTex(512, tileTex('#c9c4ba', '#a9a399', 2, 43, 10, 0.1), 1.0), 0.95);
  M.glass = new THREE.MeshPhysicalMaterial({ color: '#bfd8e2', roughness: 0.05, metalness: 0, transparent: true, opacity: 0.22, depthWrite: false, envMapIntensity: 1.2 });
  M.alu = std('#3a3d40', 0.45, 0.6);
  M.chrome = std('#d4d8dc', 0.2, 1);
  M.black = std('#1d1f21', 0.4);
  M.screen = std('#0c0e10', 0.15, 0.2);
  M.white = std('#f6f6f4', 0.5);
  M.porcelain = std('#fbfbfa', 0.15);
  M.paintSage = std('#a7b39d', 0.95);
  M.paintMajlis = std('#d7c19e', 0.95);
  M.paintBlue = std('#b6c3cc', 0.95);
  M.paintRose = std('#d9c2b6', 0.95);
  M.paintDining = std('#c7b39a', 0.95);
  M.sofa = texMat(canvasTex(256, noiseTex('#b8b4ac', 0.08, 51), 0.5), 1);

  M.sofaDark = texMat(canvasTex(256, noiseTex('#5f6b70', 0.08, 52), 0.5), 1);

/* ================= الباني: يجمع الأشكال ثم يدمجها حسب المادة ================= */
class Builder {
  constructor() { this.items = new Map(); }
  add(group, mat, geom) {
    if (!this.items.has(group)) this.items.set(group, new Map());
    const mm = this.items.get(group);
    if (!mm.has(mat)) mm.set(mat, []);
    mm.get(mat).push(geom);
  }
  finalize() {
    for (const [group, mm] of this.items) for (const [mat, list] of mm) {
      const geoms = list.map(g => {
        let n = g.index ? g.toNonIndexed() : g;
        for (const k of Object.keys(n.attributes)) if (!['position', 'normal', 'uv'].includes(k)) n.deleteAttribute(k);
        if (!n.attributes.uv) n.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n.attributes.position.count * 2), 2));
        if (mat.userData.worldUV) worldUV(n);
        return n;
      });
      const merged = mergeGeometries(geoms, false);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = !mat.transparent && !mat.emissive?.getHex?.();
      mesh.receiveShadow = !mat.transparent;
      group.add(mesh);
    }
  }
}
function worldUV(g) {
  const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    if (ay >= ax && ay >= az) uv.setXY(i, p.getX(i), p.getZ(i));
    else if (ax >= az) uv.setXY(i, p.getZ(i), p.getY(i));
    else uv.setXY(i, p.getX(i), p.getY(i));
  }
}
const B = new Builder();
class Frame {
  constructor(group, ox = 0, oy = 0, oz = 0, rot = 0) {
    this.g = group;
    this.M = new THREE.Matrix4().makeTranslation(ox, oy, oz).multiply(new THREE.Matrix4().makeRotationY(rot));
  }
  add(mat, geom) { geom.applyMatrix4(this.M); B.add(this.g, mat, geom); return geom; }
  box(mat, x1, y1, z1, x2, y2, z2) {
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1), d = Math.abs(z2 - z1), m = Math.min(w, h, d);
    const g = (this.g === groups.f0 || this.g === groups.f1) && m > 0.04 && Math.max(w, h, d) < 4
      ? new RoundedBoxGeometry(w, h, d, 2, Math.min(0.035, m * 0.3))
      : new THREE.BoxGeometry(w, h, d);
    g.translate((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2); return this.add(mat, g);
  }
  cyl(mat, x, z, r, y1, y2, seg = 18, rTop) {
    const g = new THREE.CylinderGeometry(rTop ?? r, r, y2 - y1, seg); g.translate(x, (y1 + y2) / 2, z); return this.add(mat, g);
  }
  sphere(mat, x, y, z, r, sx = 1, sy = 1, sz = 1, seg = 12) {
    const g = new THREE.SphereGeometry(r, seg, Math.max(6, Math.round(seg * 0.7))); g.scale(sx, sy, sz); g.translate(x, y, z); return this.add(mat, g);
  }

    const A = new THREE.Vector3(...a), Bv = new THREE.Vector3(...b), d = Bv.clone().sub(A), len = d.length();
    const g = new THREE.BoxGeometry(w, h, len);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), d.normalize());
    g.applyQuaternion(q); g.translate((A.x + Bv.x) / 2, (A.y + Bv.y) / 2, (A.z + Bv.z) / 2); return this.add(mat, g);
  }

}

const SURFACES = [];  // {x1,x2,z1,z2,h:(x,z)=>y}
const surf = (x1, x2, z1, z2, h) => SURFACES.push({ x1, x2, z1, z2, h: typeof h === 'number' ? () => h : h });
const solid = (x1, x2, z1, z2, y1, y2) => COLLIDERS.push({ x1: Math.min(x1, x2), x2: Math.max(x1, x2), z1: Math.min(z1, z2), z2: Math.max(z1, z2), y1, y2 });

/* ================= بناء الجدران ================= */
function buildWall(grp, y0, w, upper) {
  const F = new Frame(grp);
  const horiz = w.z !== undefined;
  const a = horiz ? w.x1 : w.z1, b = horiz ? w.x2 : w.z2, c = horiz ? w.z : w.x;
  const t = w.out ? T_OUT : T_IN;
  const ext = w.out ? T_OUT / 2 : 0;          // تمديد الجدار الخارجي ليغلق الزوايا
  const top = y0 + FH;
  // يحوّل (على طول الجدار u، عبر الجدار v) إلى صندوق
  const boxUV = (mat, u1, u2, v1, v2, yA, yB) => horiz ? F.box(mat, u1, yA, c + v1, u2, yB, c + v2) : F.box(mat, c + v1, yA, u1, c + v2, yB, u2);
  const piece = (u1, u2, yA, yB, collide = true) => {
    if (u2 - u1 < 0.001 || yB - yA < 0.001) return;
    if (w.out) {
      const s = w.out; // طبقتان: دهان داخلي وواجهة خارجية
      const inV = s > 0 ? [-t / 2, -t / 2 + 0.06] : [t / 2 - 0.06, t / 2];
      const outV = s > 0 ? [-t / 2 + 0.06, t / 2] : [-t / 2, t / 2 - 0.06];
      boxUV(M.wall, u1, u2, inV[0], inV[1], yA, yB);
      boxUV(M.facade, u1, u2, outV[0], outV[1], yA, yB);
    } else boxUV(M.wall, u1, u2, -t / 2, t / 2, yA, yB);
    if (collide) horiz ? solid(u1, u2, c - t / 2, c + t / 2, yA, yB) : solid(c - t / 2, c + t / 2, u1, u2, yA, yB);
  };
  const ops = [...w.o].sort((p, q) => p.c - q.c);
  let cur = a - ext;
  for (const op of ops) {
    const o1 = op.c - op.w / 2, o2 = op.c + op.w / 2;
    piece(cur, o1, y0, top);
    if (op.kind === 'window') {
      piece(o1, o2, y0, y0 + op.sill);
      piece(o1, o2, y0 + op.head, top);
      horiz ? solid(o1, o2, c - t / 2, c + t / 2, y0, top) : solid(c - t / 2, c + t / 2, o1, o2, y0, top);
      buildWindow(F, horiz, c, o1, o2, y0 + op.sill, y0 + op.head, t, w.out);
    } else if (op.kind === 'door') {
      const head = y0 + (op.entry ? 2.5 : 2.2);
      piece(o1, o2, head, top, false);
      buildDoor(F, horiz, c, o1, o2, y0, head, t, op, w.out);
    }
    cur = o2;
  }
  piece(cur, b + ext, y0, top);
}
function buildWindow(F, horiz, c, u1, u2, yA, yB, t, out) {
  const box = (mat, a1, a2, v1, v2, y1, y2) => horiz ? F.box(mat, a1, y1, c + v1, a2, y2, c + v2) : F.box(mat, c + v1, y1, a1, c + v2, y2, a2);
  const f = 0.05;
  box(M.alu, u1, u2, -0.04, 0.04, yA, yA + f); box(M.alu, u1, u2, -0.04, 0.04, yB - f, yB);
  box(M.alu, u1, u1 + f, -0.04, 0.04, yA, yB); box(M.alu, u2 - f, u2, -0.04, 0.04, yA, yB);
  if (u2 - u1 > 1.0) box(M.alu, (u1 + u2) / 2 - 0.025, (u1 + u2) / 2 + 0.025, -0.04, 0.04, yA, yB);
  box(M.glass, u1 + f, u2 - f, -0.006, 0.006, yA + f, yB - f);
  const s = out || 1; // عتبة رخامية من الداخل
  box(M.marble, u1 - 0.05, u2 + 0.05, s > 0 ? -t / 2 - 0.04 : t / 2 + 0.04, 0, yA - 0.03, yA);
  if (out) box(M.trim, u1 - 0.12, u2 + 0.12, s > 0 ? 0.02 : -t / 2 - 0.06, s > 0 ? t / 2 + 0.06 : -0.02, yA - 0.08, yA);
}
function buildDoor(F, horiz, c, u1, u2, y0, head, t, op, out) {
  const box = (mat, a1, a2, v1, v2, y1, y2) => horiz ? F.box(mat, a1, y1, c + v1, a2, y2, c + v2) : F.box(mat, c + v1, y1, a1, c + v2, y2, a2);
  const cw = 0.06, ct = t / 2 + 0.015;
  box(M.walnut, u1 - cw, u1, -ct, ct, y0, head + cw);
  box(M.walnut, u2, u2 + cw, -ct, ct, y0, head + cw);
  box(M.walnut, u1 - cw, u2 + cw, -ct, ct, head, head + cw);
  box(M.stair, u1, u2, -t / 2, t / 2, y0, y0 + 0.012);
  // ضلفة مفتوحة 90° على جانب swing
  const s = op.swing || 1, lt = 0.045;
  const leaf = (hu, width, dir) => {
    const v1 = s > 0 ? t / 2 : -t / 2, v2 = v1 + s * (width);
    const ua = dir > 0 ? hu : hu - lt, ub = dir > 0 ? hu + lt : hu;
    if (op.entry || op.glass) {
      box(M.walnut, ua, ub, Math.min(v1, v2), Math.max(v1, v2), y0 + 0.01, head - 0.01);
      box(M.glass, ua - 0.005, ub + 0.005, Math.min(v1, v2) + 0.12, Math.max(v1, v2) - 0.12, y0 + 0.5, head - 0.25);
    } else box(M.walnut, ua, ub, Math.min(v1, v2), Math.max(v1, v2), y0 + 0.01, head - 0.01);
    const hv = v1 + s * (width - 0.08);
    box(M.chrome, dir > 0 ? ub : ua - 0.06, dir > 0 ? ub + 0.06 : ua, Math.min(hv, hv + s * 0.02), Math.max(hv, hv + s * 0.02), y0 + 1.0, y0 + 1.04);
  };
  if (op.entry) { leaf(u1, (u2 - u1) / 2, 1); leaf(u2, (u2 - u1) / 2, -1); }
  else if (op.hinge === 'end') leaf(u2, u2 - u1, -1);
  else leaf(u1, u2 - u1, 1);
}

function slabWithHole(F, mat, y1, y2, R, hole) {
  if (!hole) return F.box(mat, R.x1, y1, R.z1, R.x2, y2, R.z2);
  F.box(mat, R.x1, y1, R.z1, R.x2, y2, hole.z1);
  F.box(mat, R.x1, y1, hole.z2, R.x2, y2, R.z2);
  F.box(mat, R.x1, y1, hole.z1, hole.x1, y2, hole.z2);
  F.box(mat, hole.x2, y1, hole.z1, R.x2, y2, hole.z2);
}
const HOLE = { x1: 0, x2: 4.2, z1: 4.45, z2: 7.3 };
const INTERIOR = [{ x1: 0, x2: 14, z1: 2.4, z2: 16 }, { x1: 0, x2: 6.6, z1: 0, z2: 2.4 }, { x1: 8.7, x2: 14, z1: 0, z2: 2.4 }];
const WET = [{ x1: 4.2, x2: 5.5, z1: 4.45, z2: 6.3 }, { x1: 6.4, x2: 8.7, z1: 12.3, z2: 13.6 }, { x1: 4.85, x2: 8.7, z1: 13.6, z2: 16 }];

function clipRect(r, hole) {
  if (!hole || r.x2 <= hole.x1 || r.x1 >= hole.x2 || r.z2 <= hole.z1 || r.z1 >= hole.z2) return [r];
  const out = [];
  if (r.z1 < hole.z1) out.push({ ...r, z2: hole.z1 });
  if (r.z2 > hole.z2) out.push({ ...r, z1: hole.z2 });
  const zA = Math.max(r.z1, hole.z1), zB = Math.min(r.z2, hole.z2);
  if (r.x1 < hole.x1) out.push({ x1: r.x1, x2: hole.x1, z1: zA, z2: zB });
  if (r.x2 > hole.x2) out.push({ x1: hole.x2, x2: r.x2, z1: zA, z2: zB });
  return out;
}

function buildFloors(grp, level) {
  const F = new Frame(grp);

  } else {

    F.box(M.stair, 0.125, a, za, 1.4, h1, zb);

function rboxGeo(w, h, d, r) { return new RoundedBoxGeometry(w, h, d, 3, Math.max(0.002, Math.min(r, Math.min(w, h, d) / 2 - 0.002))); }
function rbox(F, mat, x1, y1, z1, x2, y2, z2, r = 0.05) { const g = rboxGeo(Math.abs(x2 - x1), Math.abs(y2 - y1), Math.abs(z2 - z1), r); g.translate((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2); return F.add(mat, g); }

function card(F, mat, x, y, z, size, rx, ry, rz) { const g = new THREE.PlaneGeometry(size, size); g.rotateZ(rz); g.rotateX(rx); g.rotateY(ry); g.translate(x, y, z); return F.add(mat, g); }

/* ================= أشجار ونخيل وزهور ================= */
function tree(F, x, z, s = 1, seed = 1) {
  const r = rng(seed);
  const H = 3.2 * s;
  F.cyl(DX.bark, x, z, 0.16 * s, 0, H * 0.55, 10, 0.11 * s);
  const crown = [];
  for (let b = 0; b < 5; b++) {
    const a = b / 5 * 6.28 + r(), y0 = H * (0.4 + r() * 0.15), len = 1.3 * s * (0.7 + r() * 0.4);
    const ex = x + Math.cos(a) * len * 0.75, ez = z + Math.sin(a) * len * 0.75, ey = y0 + len * 0.7;
    F.beam(DX.bark, [x, y0, z], [ex, ey, ez], 0.09 * s, 0.09 * s);
    crown.push([ex, ey, ez]);
  }
  crown.push([x, H * 0.95, z]);
  const n = Math.round(130 * s);
  for (let i = 0; i < n; i++) {
    const c = crown[i % crown.length], R = 1.1 * s;
    const u = r() * 6.28, v = Math.acos(2 * r() - 1), d = Math.cbrt(r()) * R;
    card(F, r() > 0.5 ? DX.leafA : DX.leafB, c[0] + Math.sin(v) * Math.cos(u) * d, c[1] + Math.cos(v) * d * 0.75, c[2] + Math.sin(v) * Math.sin(u) * d, 0.9 * s, r() * 6.28, r() * 6.28, r() * 6.28);
  }
}
function palm(F, x, z, h = 5, seed = 1, y = 0) {
  const r = rng(seed);
  const lean = (r() - 0.5) * 0.4, la = r() * 6.28;
  const top = [x + Math.cos(la) * lean, y + h, z + Math.sin(la) * lean];
  const segs = 6;
  for (let i = 0; i < segs; i++) {
    const t0 = i / segs, t1 = (i + 1) / segs, ease = (t) => t * t;
    const p0 = [x + (top[0] - x) * ease(t0), y + h * t0, z + (top[2] - z) * ease(t0)], p1 = [x + (top[0] - x) * ease(t1), y + h * t1, z + (top[2] - z) * ease(t1)];
    const g = new THREE.CylinderGeometry(0.17 - 0.03 * t1, 0.2 - 0.03 * t0, h / segs + 0.02, 12);
    const d = new THREE.Vector3(p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2]);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));
    g.translate((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2, (p0[2] + p1[2]) / 2); F.add(DX.palmBark, g);
  }
  F.sphere(DX.palmBark, top[0], top[1], top[2], 0.26, 1, 0.9, 1, 10);
  const n = 20;
  for (let i = 0; i < n; i++) {
    const az = i / n * 6.28 + r() * 0.2, up = 0.5 + (i % 3) * 0.35 + r() * 0.2, L = 2.4 + r() * 0.6;
    const g = new THREE.PlaneGeometry(1.0, L, 1, 10);

      const px = p.getX(k), t = (p.getY(k) + L / 2) / L, sDist = t * L;
      const ang = up - t * 1.7;
      p.setXYZ(k, px, Math.sin(ang) * sDist * 0.6 + Math.abs(px) * 0.25 - t * t * 0.7, Math.cos(up * 0.4) * sDist);
    }
    g.computeVertexNormals(); g.rotateY(az); g.translate(top[0], top[1], top[2]);
    F.add(DX.frond, g);
  }
  for (let i = 0; i < 3; i++) { const a = r() * 6.28; F.sphere(DX.dates, top[0] + Math.cos(a) * 0.32, top[1] - 0.35, top[2] + Math.sin(a) * 0.32, 0.16, 1, 1.4, 1, 8); }
}

}
function flowerBed(F, x1, z1, x2, z2, y = 0, density = 26, seed = 5, colors) {
  const r = rng(seed);

  for (const sx of [-0.45, 0.45]) rboxRot(F, DX.pillow, sx, 0.78, 0.3, 0.78, 0.2, 0.46, 0.09, -1.05);
  for (const sx of [-0.28, 0.28]) rboxRot(F, throwMat, sx, 0.78, 0.5, 0.42, 0.14, 0.38, 0.06, -1.15);
  rboxRot(F, DX.pillow, 0, 0.74, 0.62, 0.5, 0.12, 0.28, 0.05, -1.25);
  for (const s of [-1, 1]) {
    const x = s * 1.38;
    rbox(F, frameMat, x - 0.26, 0.12, 0.02, x + 0.26, 0.55, 0.44, 0.02);

const PLACED = [];

function worldPt(F, x, y, z) { return new THREE.Vector3(x, y, z).applyMatrix4(F.M); }
function placeModel(group, name, x, y, z, rot = 0, scale = 1, fit = 0, fitH = 0) { PLACED.push({ group, name, x, y, z, rot, scale, fit, fitH }); }
function plant(F, x, y, z, s = 1) {
  if (isInterior(F)) { const p = worldPt(F, x, y, z); placeModel(F.g, 'DiffuseTransmissionPlant', p.x, p.y, p.z, (x * 7 + z * 3) % 6.28, 1.25 * s); return; }

  F.cyl(M.trunk, x, z, 0.03 * s, y + 0.4 * s, y + 0.9 * s, 6);
  F.sphere(M.leaf, x, y + 1.05 * s, z, 0.38 * s, 1, 1.2, 1, 10);
  F.sphere(M.leafDark, x + 0.15 * s, y + 0.85 * s, z + 0.1 * s, 0.26 * s, 1, 1, 1, 8);
}
function flowers(F, x, y, z, mats = [M.flowerRed, M.flowerPink, M.flowerYellow, M.flowerWhite], s = 1) {
  if (isInterior(F)) { const p = worldPt(F, x, y, z); placeModel(F.g, 'GlassVaseFlowers', p.x, p.y, p.z, 0, 2.4 * s); return; }
  F.cyl(M.glass, x, z, 0.08 * s, y, y + 0.28 * s, 12, 0.06 * s);
  const r = rng(Math.round(x * 100 + z * 7));
  for (let i = 0; i < 9; i++) {
    const a = r() * 6.28, d = r() * 0.12 * s, h = y + (0.38 + r() * 0.14) * s;
    F.beam(M.leafDark, [x, y + 0.1, z], [x + Math.cos(a) * d, h, z + Math.sin(a) * d], 0.008, 0.008);
    F.sphere(mats[i % mats.length], x + Math.cos(a) * d, h, z + Math.sin(a) * d, 0.045 * s, 1, 0.8, 1, 8);
  }
}

cv.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId) return; player.yaw += (e.clientX - drag.x) * 0.004; player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch + (e.clientY - drag.y) * 0.004)); drag.x = e.clientX; drag.y = e.clientY; });
cv.addEventListener('pointerup', () => drag = null); cv.addEventListener('pointercancel', () => drag = null);
// عصا تحكم للمس
const stick = $('stick'), knob = $('knob'); let joy = { x: 0, y: 0, id: null };
if (matchMedia('(pointer: coarse)').matches && !RECORD) { stick.hidden = false; $('roomSub').textContent = 'العصا للمشي · اسحب للالتفات'; }
stick.addEventListener('pointerdown', e => { if (mode !== 'walk') setMode('walk'); joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); moveJoy(e); });
stick.addEventListener('pointermove', e => { if (joy.id === e.pointerId) moveJoy(e); });
const endJoy = () => { joy = { x: 0, y: 0, id: null }; knob.style.transform = ''; };
stick.addEventListener('pointerup', endJoy); stick.addEventListener('pointercancel', endJoy);
function moveJoy(e) { const r = stick.getBoundingClientRect(); let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dy = (e.clientY - r.top - r.height / 2) / (r.height / 2); const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } joy.x = dx; joy.y = dy; knob.style.transform = `translate(${dx * 37}px, ${dy * 37}px)`; }

function walkStep(dt) {
  let f = 0, s = 0;
  if (keys.has('w') || keys.has('arrowup')) f += 1;
  if (keys.has('s') || keys.has('arrowdown')) f -= 1;
  if (keys.has('a')) s -= 1; if (keys.has('d')) s += 1;
  if (keys.has('arrowleft') || keys.has('q')) player.yaw += dt * 1.6;
  if (keys.has('arrowright') || keys.has('e')) player.yaw -= dt * 1.6;
  f -= joy.y; s += joy.x;
  const sp = (keys.has('shift') ? 2.6 : 1.5) * dt;
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = (-sin * f + cos * s) * sp, dz = (-cos * f - sin * s) * sp;
  const tryMove = (nx, nz) => { const g = groundAt(nx, nz, player.foot); if (g > player.foot + 0.45 || blocked(nx, nz, Math.max(g, player.foot))) return false; player.x = nx; player.z = nz; return true; };
  if (!tryMove(player.x + dx, player.z + dz)) { tryMove(player.x + dx, player.z) || tryMove(player.x, player.z + dz); }
  const g = groundAt(player.x, player.z, player.foot);
  player.foot += (g - player.foot) * Math.min(1, dt * (g < player.foot - 0.5 ? 6 : 12));
}

/* ================= العرض ================= */
const plate = $('roomName'), plateSub = $('roomSub');
let lastLabel = '';
function setLabel(n, s) { const key = n + '|' + s; if (key === lastLabel) return; lastLabel = key; plate.textContent = n; if (s !== null) plateSub.textContent = s; }
player.foot = groundAt(player.x, player.z, 0);
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (mode === 'tour') {
    tourT += dt; if (tourT >= TOUR_END) { tourT = TOUR_END; setMode('walk'); }
    const p = tourAt(tourT); applyCam(p.x, p.y, p.z, p.yaw, p.pitch);
    setLabel(labelAt(tourT), `${Math.floor(tourT / 60)}:${String(Math.floor(tourT % 60)).padStart(2, '0')} / ${Math.floor(TOUR_END / 60)}:${String(Math.floor(TOUR_END % 60)).padStart(2, '0')}`);
  } else if (mode === 'walk') {
    walkStep(dt); applyCam(player.x, player.foot + EYE, player.z, player.yaw, player.pitch);
    const r = roomAt(player.x, player.z, player.foot); setLabel(r.n, r.s || 'اسحب للالتفات · W A S D أو الأسهم للمشي');
  } else {
    orbit.update(); setLabel(topFloor ? 'الطابق الأول من الأعلى' : 'الطابق الأرضي من الأعلى', 'اسحب للتدوير · مرّر للتكبير');
  }
  if (mode !== 'top') {
    // داخل البيت نرسم أثاث الطابق الحالي فقط
    const c = camera.position, inside = c.x > 0 && c.x < 14 && c.z > 0 && c.z < 16;
    const up = c.y > LV[1] + 0.6;
    groups.f0.visible = !inside || !up;
    groups.f1.visible = !inside || up;
    groups.veranda.visible = !inside || up;
  }
  draw();
}
// ظلال الزوايا والتلامس (Ambient Occlusion) لمظهر أقرب للواقع
let hq = !MOBILE;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ao = new GTAOPass(scene, camera, W0, H0);
ao.updateGtaoMaterial({ radius: 0.5, distanceExponent: 1.5, thickness: 1.0, scale: 1.2, samples: 16 });
ao.blendIntensity = 1.0;
composer.addPass(ao);
composer.addPass(new OutputPass());
function draw() { if (hq) composer.render(); else renderer.render(scene, camera); }
function setQuality(on) {
  hq = on; $('bQ').setAttribute('aria-pressed', on); $('bQ').textContent = on ? 'جودة عالية' : 'جودة عادية';
  renderer.setPixelRatio(RECORD ? 1 : Math.min(devicePixelRatio, on ? 2 : 1)); resize(); renderer.shadowMap.needsUpdate = true;
}
function resize() { if (RECORD) return; const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
$('bQ').onclick = () => setQuality(!hq);
setQuality(hq);
setMode('walk');
applyCam(player.x, player.foot + EYE, player.z, player.yaw, player.pitch);
$('loading').remove();

if (RECORD) {
  // واجهة التسجيل: تُستدعى من سكربت الفيديو لكل لقطة
  const comp = document.createElement('canvas'); comp.width = W0; comp.height = H0; const cx = comp.getContext('2d');
  window.__tour = { duration: TOUR_END, labels: TRACK.filter(n => n.label).map(n => [n.label, +n.t.toFixed(1)]) };
  window.__frame = (t) => {
    const p = tourAt(t); applyCam(p.x, p.y, p.z, p.yaw, p.pitch); draw();
    cx.drawImage(renderer.domElement, 0, 0);
    const label = labelAt(t);
    if (label) {
      cx.font = '700 34px Tajawal, sans-serif'; cx.direction = 'rtl'; cx.textAlign = 'center';
      const w = cx.measureText(label).width + 56, x = W0 / 2, y = H0 - 58;
      cx.fillStyle = 'rgba(250,249,246,0.86)'; cx.beginPath(); cx.roundRect(x - w / 2, y - 34, w, 54, 12); cx.fill();
      cx.fillStyle = '#1f2a27'; cx.fillText(label, x, y + 4);
    }
    return comp.toDataURL('image/jpeg', 0.92);
  };
  window.__shot = (x, y, z, lx, ly, lz, label) => {
    camera.position.set(x, y, z); camera.lookAt(lx, ly, lz); draw(); cx.drawImage(renderer.domElement, 0, 0);
    if (label) {
      cx.font = '700 34px Tajawal, sans-serif'; cx.direction = 'rtl'; cx.textAlign = 'center';
      const w = cx.measureText(label).width + 56, X = W0 / 2, Y = H0 - 58;
      cx.fillStyle = 'rgba(250,249,246,0.86)'; cx.beginPath(); cx.roundRect(X - w / 2, Y - 34, w, 54, 12); cx.fill();
      cx.fillStyle = '#1f2a27'; cx.fillText(label, X, Y + 4);
    }
    return comp.toDataURL('image/jpeg', 0.92);
  };
  window.__dbg = { draw, renderer, camera, scene, tourAt, applyCam, sun };
  window.__ready = true;
} else {
  renderer.setAnimationLoop(frame);
}
window.__scene = scene; window.__groups = groups;
</script>
